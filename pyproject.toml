[project]
name = "wash-sale-auditor"
version = "0.1.0"
description = "Multi-Broker Cross-Account Wash Sale & Tax Loss Harvesting Auditor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "duckdb>=0.9.0",
    "lxml>=4.9.0",
    "plaid-python>=20.0.0",
    "plotly>=5.15.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "plaid.*",
    "lxml.*",
    "arelle.*",
    "duckdb.*",
    "plotly.*",
    "streamlit.*",
    "sklearn.*",
    "scipy.*",
    "networkx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
